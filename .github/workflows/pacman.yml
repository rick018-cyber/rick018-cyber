name: Generate Pac-Man Game

on:
  schedule:
    - cron: "0 */24 * * *"   # runs every 24 hours
  workflow_dispatch:          # allow manual trigger
  push:
    branches:
      - main                  # also run on pushes to main

# ✅ give Actions write access to push Pac-Man files
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate pacman.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: rick018-cyber
          output_path: dist/pacman.svg   # same pattern as snake

      - name: Push pacman files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output    # branch to store pacman files
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
