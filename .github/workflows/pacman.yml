name: Generate Pac-Man Game

on:
  schedule:
    - cron: "0 */24 * * *"   # runs every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Pac-Man graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: rick018-cyber
          output_path: dist/pacman-contribution-graph.svg   # ✅ force into dist/

      - name: Push Pac-Man files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist          # ✅ only push dist/ folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
