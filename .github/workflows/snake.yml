name: Generate Snake and Pac-Man

on:
  schedule:
    - cron: "0 */24 * * *"   # runs every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Generate Snake SVGs
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: rick018-cyber
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      # 3. Ensure dist folder exists for Pac-Man
      - name: Ensure dist folder
        run: mkdir -p dist

      # 4. Generate Pac-Man SVGs
      - name: Generate Pac-Man SVG
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
            <circle cx="50" cy="50" r="50" fill="yellow"/>
            <polygon points="50,50 100,25 100,75" fill="black"/>
          </svg>' > dist/pacman.svg

      - name: Generate Pac-Man Dark SVG
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
            <circle cx="50" cy="50" r="50" fill="yellow"/>
            <polygon points="50,50 100,25 100,75" fill="white"/>
          </svg>' > dist/pacman-dark.svg

      - name: Generate Pac-Man Light SVG
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
            <circle cx="50" cy="50" r="50" fill="yellow"/>
            <polygon points="50,50 100,25 100,75" fill="black"/>
          </svg>' > dist/pacman-light.svg

      # 5. Push all SVGs (Snake + Pac-Man) to output branch
      - name: Push all SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output      # branch to store all SVGs
          build_dir: dist
          keep_files: true           # preserves existing files, adds/updates new ones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
