name: Generate Pac-Man

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Ensure output folder exists
      - name: Ensure Output Folder
        run: mkdir -p ./output

      # 3. Generate Pac-Man SVG
      - name: Generate Pac-Man SVG
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
            <circle cx="50" cy="50" r="50" fill="yellow"/>
            <polygon points="50,50 100,25 100,75" fill="black"/>
          </svg>' > ./output/pacman.svg

      # 4. Commit & push only if changes exist
      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./output/pacman.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update Pac-Man SVG"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
