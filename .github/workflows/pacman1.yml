name: Generate Pac-Man

on:
  schedule:
    - cron: "0 */24 * * *"   # runs every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Ensure dist folder exists
      - name: Ensure dist folder
        run: mkdir -p dist

      # 3. Generate Pac-Man SVG
      - name: Generate Pac-Man SVG
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
            <circle cx="50" cy="50" r="50" fill="yellow"/>
            <polygon points="50,50 100,25 100,75" fill="black"/>
          </svg>' > dist/pacman.svg

      # 4. Push to output branch
      - name: Push Pac-Man to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_files: true          # <--- Important: keeps existing files and adds/updates pacman.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
