name: Generate Pac-Man

on:
  schedule:
    - cron: "0 */24 * * *"   # runs every 24 hours
  workflow_dispatch:          # allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Ensure output folder exists
        run: mkdir -p dist

      - name: Generate Pac-Man SVG
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
            <circle cx="50" cy="50" r="50" fill="yellow"/>
            <polygon points="50,50 100,25 100,75" fill="black"/>
          </svg>' > dist/pacman.svg

      - name: Push Pac-Man SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output    # branch to store Pac-Man SVG
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
